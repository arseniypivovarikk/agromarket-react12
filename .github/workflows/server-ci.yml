name: Server CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agromarket-server/package-lock.json
      - name: Install server dependencies
        working-directory: agromarket-server
        run: npm install
      - name: Run tests
        working-directory: agromarket-server
        run: npm test
